<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CampusRide - Coordinator Dashboard</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --red: #dc2626;
      --red-bg: #fee2e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b1329; display: flex; justify-content: center; min-height: 100vh; }
    
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar .title-group h3 { font-size: 16px; font-weight: 700; color: var(--text); }
    .top-bar .title-group p { font-size: 11px; color: var(--text-muted); }
    .icon-btn { background: none; border: none; font-size: 22px; color: var(--text); cursor: pointer; display: flex; align-items: center; }

    .content-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; height: 100%; }

    .hero-banner {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border-radius: 16px;
      padding: 18px 20px;
      color: white;
    }
    .hero-banner h2 { font-size: 18px; margin-bottom: 2px; }
    .hero-banner p { font-size: 12px; opacity: 0.9; }

    .section-head { display: flex; justify-content: space-between; align-items: center; }
    .section-head h4 { font-size: 14px; font-weight: 700; color: var(--text); }
    .badge-tag { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 4px 8px; border-radius: 6px; }

    .bus-list { display: flex; flex-direction: column; gap: 10px; }
    .bus-card {
      background: var(--surface);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bus-card.assigned { border: 2px solid var(--primary); background: #f0f7ff; }
    .bus-top-row { display: flex; align-items: center; justify-content: space-between; }
    .bus-meta-group { display: flex; align-items: center; gap: 12px; }
    .bus-icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .bus-id { font-size: 14px; font-weight: 700; color: var(--text); }
    .bus-route { font-size: 12px; color: var(--text-muted); }
    .status-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
    .status-live { background: var(--green-bg); color: var(--green); }
    .status-off { background: var(--red-bg); color: var(--red); }

    .bus-control-row { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
    .btn-broadcast { flex: 1; padding: 12px; border-radius: 9px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-start-gps { background: var(--green); color: #fff; }
    .btn-stop-gps { background: var(--red); color: #fff; display: none; }

    #gpsStatusBox { padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 600; line-height: 1.4; display: none; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-card { background: #fff; width: 100%; max-width: 380px; border-radius: 18px; padding: 22px; }
    .modal-card textarea { width: 100%; height: 90px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; outline: none; margin: 12px 0; resize: none; }
    .modal-actions { display: flex; gap: 8px; }
    .btn-modal { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="top-bar">
    <div class="title-group">
      <h3>CampusRide</h3>
      <p>Coordinator Broadcast Portal</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="icon-btn" onclick="openAnnounceModal()" title="Broadcast Delay"><i class="ph-bold ph-megaphone"></i></button>
      <button class="icon-btn" onclick="logout()" title="Logout"><i class="ph-bold ph-sign-out"></i></button>
    </div>
  </div>

  <div class="content-body">
    <div class="hero-banner">
      <h2 id="coordHeroName">Welcome, Coordinator 👋</h2>
      <p id="coordHeroBus">Assigned Bus: BUS 1</p>
    </div>

    <div class="section-head">
      <h4>Fleet Control</h4>
      <span class="badge-tag" id="myBusBadge">MY BUS: BUS 1</span>
    </div>

    <div id="gpsStatusBox"></div>

    <div class="bus-list" id="coordBusList"></div>
  </div>

</div>

<!-- Delay Modal -->
<div class="modal-overlay" id="announceModal">
  <div class="modal-card">
    <h3 style="font-size: 16px;">Broadcast Delay Alert</h3>
    <p style="font-size: 11px; color: var(--text-muted);">Target: Assigned bus passengers</p>
    <textarea id="modalInput" placeholder="e.g. Delayed by 15 mins due to traffic at Rawatpur..."></textarea>
    <div class="modal-actions">
      <button class="btn-modal" style="background: #f1f5f9;" onclick="closeAnnounceModal()">Cancel</button>
      <button class="btn-modal" style="background: var(--primary); color: white;" onclick="submitAnnouncement()">Broadcast</button>
    </div>
  </div>
</div>

<script type="module">
  import { db, ref, set, update, onValue, auth, signOut } from "./firebase-config.js";
  import { AXIS_BUS_ROUTES } from "./bus-routes.js";

  const session = JSON.parse(localStorage.getItem("campusride_user") || "null");
  if (!session || session.role !== "coordinator") {
    window.location.href = "login.html";
    throw new Error("Coordinator session required");
  }

  const assignedBus = session.busId || "BUS 1";
  const busKeys = Object.keys(AXIS_BUS_ROUTES);
  let watchId = null;
  let activeBroadcastBus = null;
  let lastWriteTimestamp = 0;
  let wakeLock = null;

  document.getElementById("coordHeroName").innerText = `Welcome, ${session.name || "Coordinator"} 👋`;
  document.getElementById("coordHeroBus").innerText = `Assigned Bus: ${assignedBus}`;
  document.getElementById("myBusBadge").innerText = `MY BUS: ${assignedBus}`;

  window.logout = async function () {
    stopBroadcast(assignedBus, true);
    try { await signOut(auth); } catch(e){}
    localStorage.removeItem("campusride_user");
    window.location.href = "login.html";
  };

  function setStatus(text, type = "info") {
    const box = document.getElementById("gpsStatusBox");
    box.style.display = "block";
    box.textContent = text;
    box.style.background = type === "ok" ? "#dcfce7" : type === "error" ? "#fee2e2" : "#eff6ff";
    box.style.color = type === "ok" ? "#166534" : type === "error" ? "#b91c1c" : "#1d4ed8";
  }

  function renderCards() {
    document.getElementById("coordBusList").innerHTML = busKeys.map(bId => {
      const isMine = bId === assignedBus;
      const safeId = bId.replace(/\s+/g, "_");
      const r = AXIS_BUS_ROUTES[bId];
      return `
        <div class="bus-card ${isMine ? "assigned" : ""}">
          <div class="bus-top-row">
            <div class="bus-meta-group">
              <div class="bus-icon-wrap" id="icon_${safeId}"><i class="ph-bold ph-bus"></i></div>
              <div>
                <div class="bus-id">${bId} ${isMine ? '<span style="font-size:10px;color:#2563eb;">(MY BUS)</span>' : ""}</div>
                <div class="bus-route">${r ? r.routeName : "Route"}</div>
              </div>
            </div>
            <span class="status-badge status-off" id="pill_${safeId}">OFFLINE</span>
          </div>
          ${isMine ? `
            <div class="bus-control-row">
              <button class="btn-broadcast btn-start-gps" id="btnStart_${safeId}" onclick="startBroadcast('${bId}')">
                <i class="ph-bold ph-broadcast"></i> Start GPS Broadcast
              </button>
              <button class="btn-broadcast btn-stop-gps" id="btnStop_${safeId}" onclick="stopBroadcast('${bId}')">
                <i class="ph-bold ph-stop-circle"></i> Stop Broadcast
              </button>
            </div>` : ""}
        </div>`;
    }).join("");
  }
  renderCards();

  onValue(ref(db, "buses"), snapshot => {
    const data = snapshot.val() || {};
    busKeys.forEach(bId => {
      const b = data[bId];
      const safeId = bId.replace(/\s+/g, "_");
      const pill = document.getElementById(`pill_${safeId}`);
      if (pill) {
        pill.className = b?.isActive ? "status-badge status-live" : "status-badge status-off";
        pill.innerText = b?.isActive ? "LIVE" : "OFFLINE";
      }
    });
  });

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) {
      console.warn("Screen WakeLock unavailable:", err.message);
    }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  function writeLocation(bId, position) {
    const now = Date.now();
    // Throttle to 1 write every 3 seconds to preserve Firebase quota
    if (now - lastWriteTimestamp < 3000) return;
    lastWriteTimestamp = now;

    const c = position.coords;
    const payload = {
      latitude: Number(c.latitude),
      longitude: Number(c.longitude),
      speed: c.speed ? Math.round(c.speed * 3.6) : 0,
      accuracy: Math.round(c.accuracy || 0),
      isActive: true,
      coordinatorName: session.name || "Faculty Coordinator",
      lastUpdated: new Date().toISOString()
    };

    update(ref(db, `buses/${bId}`), payload)
      .then(() => setStatus(`● LIVE GPS BROADCASTING: ${payload.latitude.toFixed(5)}, ${payload.longitude.toFixed(5)} (±${payload.accuracy}m)`, "ok"))
      .catch(err => setStatus(`Write error: ${err.message}`, "error"));
  }

  window.startBroadcast = function (bId) {
    if (bId !== assignedBus) return;
    if (!navigator.geolocation) {
      setStatus("Geolocation not supported by this browser.", "error");
      return;
    }

    activeBroadcastBus = bId;
    const safeId = bId.replace(/\s+/g, "_");
    document.getElementById(`btnStart_${safeId}`).style.display = "none";
    document.getElementById(`btnStop_${safeId}`).style.display = "flex";

    requestWakeLock();
    setStatus("Acquiring GPS fix...", "info");

    watchId = navigator.geolocation.watchPosition(
      pos => writeLocation(bId, pos),
      err => setStatus(`GPS Error: ${err.message}`, "error"),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 2000 }
    );
  };

  window.stopBroadcast = function (bId, silent = false) {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    releaseWakeLock();
    activeBroadcastBus = null;

    update(ref(db, `buses/${bId}`), {
      isActive: false,
      lastUpdated: new Date().toISOString()
    });

    const safeId = bId.replace(/\s+/g, "_");
    const start = document.getElementById(`btnStart_${safeId}`);
    const stop = document.getElementById(`btnStop_${safeId}`);
    if (start) start.style.display = "flex";
    if (stop) stop.style.display = "none";
    if (!silent) setStatus("Broadcast stopped. Bus marked offline.", "info");
  };

  window.openAnnounceModal = () => document.getElementById("announceModal").style.display = "flex";
  window.closeAnnounceModal = () => document.getElementById("announceModal").style.display = "none";

  window.submitAnnouncement = function () {
    const text = document.getElementById("modalInput").value.trim();
    if (!text) return;
    set(ref(db, `announcements/${assignedBus}/latest`), {
      text,
      author: session.name || "Coordinator",
      busId: assignedBus,
      time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    }).then(() => {
      closeAnnounceModal();
      document.getElementById("modalInput").value = "";
      setStatus("Announcement sent to passengers.", "ok");
    });
  };

  window.addEventListener("beforeunload", () => {
    if (activeBroadcastBus) stopBroadcast(activeBroadcastBus, true);
  });
</script>
</body>
</html>
